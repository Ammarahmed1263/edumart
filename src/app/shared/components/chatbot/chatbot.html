<div class="chatbot-container" [class.open]="isOpen()">
  <!-- Floating Button -->
  <button
    class="chat-toggle"
    (click)="toggleChat()"
    [attr.aria-label]="isOpen() ? 'Close Chat' : 'Open Chat'"
  >
    <span *ngIf="!isOpen()" class="icon">💬</span>
    <span *ngIf="isOpen()" class="icon">✕</span>
  </button>

  <!-- Chat Window -->
  <div class="chat-window" *ngIf="isOpen()">
    <div class="chat-header">
      <h3>EduMart Assistant</h3>
      <p>Ask us anything!</p>
    </div>

    <div class="chat-messages" #scrollMe>
      <div *ngFor="let msg of chatService.messages()" [ngClass]="['message', msg.role]">
        <div class="message-content">
          {{ msg.content }}
        </div>
      </div>
      <div *ngIf="chatService.isLoading()" class="message assistant loading">
        <div class="typing-indicator"><span></span><span></span><span></span></div>
      </div>
    </div>

    <form class="chat-input" (ngSubmit)="sendMessage()">
      <input
        type="text"
        name="userInput"
        [(ngModel)]="userInput"
        placeholder="Type a message..."
        autocomplete="off"
      />
      <button type="submit" [disabled]="!userInput.trim() || chatService.isLoading()">Send</button>
    </form>
  </div>
</div>
