<div
  class="loading-card"
  [class.sm]="size === 'sm'"
  [class.lg]="size === 'lg'"
  role="status"
  aria-live="polite"
>
  <div class="spinner" aria-hidden="true"></div>
  <div class="loading-text">{{ text }}</div>
  <div class="skeleton-lines" aria-hidden="true">
    <span class="line line-1"></span>
    <span class="line line-2"></span>
    <span class="line line-3"></span>
  </div>
</div>
