<div class="header-wrapper">
  <div class="scroll-progress-container">
    <div class="scroll-progress-bar" [style.width.%]="scrollProgress()"></div>
  </div>
  
  <nav class="navbar">
    <div class="nav-left">
      <a routerLink="/" class="nav-brand"> Edumart<span class="dot">.</span></a>
    </div>

    <div class="nav-links">
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Home</a>
      <a routerLink="/courses" routerLinkActive="active">Courses</a>
      <a routerLink="/categories" routerLinkActive="active">Categories</a>
    </div>

    <div class="nav-right">
      <div class="nav-actions">
        @if (currentUser().token) {
          <a routerLink="/checkout" routerLinkActive="active" class="cart-link" title="Shopping Cart">
            <i class="fa-solid fa-cart-shopping"></i>
            @if (cartService.cartCount() > 0) {
              <span class="cart-badge">{{ cartService.cartCount() }}</span>
            }
          </a>
          
          <div class="user-menu" [class.open]="menuOpen()">
            <button class="user-pill" type="button" (click)="toggleMenu()">
              <div class="user-avatar-box">
                <span class="user-avatar">{{ getUserInitials() }}</span>
              </div>
              <span class="user-name">{{ currentUser().user?.userName || 'User' }}</span>
              <i class="fa-solid fa-chevron-down chevron"></i>
            </button>

            @if (menuOpen()) {
              <div class="menu-panel">
                <div class="menu-links">
                  <a routerLink="/my-courses" (click)="closeMenu()">
                    <i class="fa-solid fa-user"></i> 
                    <span>Profile</span>
                  </a>
                  <button class="menu-logout" type="button" (click)="logout()">
                    <i class="fa-solid fa-right-from-bracket"></i> 
                    <span>Logout</span>
                  </button>
                </div>
              </div>
            }
          </div>
        } @else {
          <a routerLink="/login" class="link-login">Login</a>
          <a routerLink="/register" class="btn-primary-nav">Get Started</a>
        }
      </div>
    </div>
  </nav>
</div>
