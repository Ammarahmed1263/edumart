<div class="header-wrapper">
  <div class="scroll-progress-container">
    <div class="scroll-progress-bar" [style.width.%]="scrollProgress()"></div>
  </div>
  
  <nav class="navbar">
    <div class="nav-left">
      <button class="mobile-toggle" (click)="toggleMobileMenu()" [class.active]="mobileMenuOpen()" aria-label="Toggle navigation">
        <i class="fa-solid" [class.fa-bars]="!mobileMenuOpen()" [class.fa-xmark]="mobileMenuOpen()"></i>
      </button>
      <a routerLink="/" class="nav-brand" (click)="closeMenu()"> Edumart<span class="dot">.</span></a>
    </div>

    <div class="nav-links desktop-only">
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Home</a>
      <a routerLink="/courses" routerLinkActive="active">Courses</a>
      <a routerLink="/categories" routerLinkActive="active">Categories</a>
    </div>

    <div class="nav-right">
      <div class="nav-actions">
        <a routerLink="/checkout" routerLinkActive="active" class="cart-link" title="Shopping Cart" (click)="closeMenu()">
          <i class="fa-solid fa-cart-shopping"></i>
          @if (cartService.cartCount() > 0) {
            <span class="cart-badge">{{ cartService.cartCount() }}</span>
          }
        </a>

        @if (currentUser().token) {
          
          <div class="user-menu" [class.open]="menuOpen()">
            <button class="user-pill" type="button" (click)="toggleMenu()">
              <div class="user-avatar-box">
                <span class="user-avatar">{{ getUserInitials() }}</span>
              </div>
              <span class="user-name">{{ currentUser().user?.userName || 'User' }}</span>
              <i class="fa-solid fa-chevron-down chevron"></i>
            </button>

            @if (menuOpen()) {
              <div class="menu-panel">
                <div class="menu-links">
                  <a routerLink="/my-courses" (click)="closeMenu()">
                    <i class="fa-solid fa-user"></i> 
                    <span>Profile</span>
                  </a>
                  <button class="menu-logout" type="button" (click)="logout()">
                    <i class="fa-solid fa-right-from-bracket"></i> 
                    <span>Logout</span>
                  </button>
                </div>
              </div>
            }
          </div>
        } @else {
          <div class="auth-btns desktop-only">
            <a routerLink="/login" class="link-login">Login</a>
            <a routerLink="/register" class="btn-primary-nav">Get Started</a>
          </div>
        }
      </div>
    </div>
  </nav>

  <!-- Mobile Menu Overlay -->
  <div class="mobile-menu" [class.open]="mobileMenuOpen()">
    <div class="mobile-menu-content">
      <div class="mobile-nav-links">
        <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" (click)="closeMenu()">
          <i class="fa-solid fa-house"></i> Home
        </a>
        <a routerLink="/courses" routerLinkActive="active" (click)="closeMenu()">
          <i class="fa-solid fa-book"></i> Courses
        </a>
        <a routerLink="/categories" routerLinkActive="active" (click)="closeMenu()">
          <i class="fa-solid fa-layer-group"></i> Categories
        </a>
      </div>
      
      @if (!currentUser().token) {
        <div class="mobile-auth-actions">
          <a routerLink="/login" class="mobile-btn-secondary" (click)="closeMenu()">Login</a>
          <a routerLink="/register" class="mobile-btn-primary" (click)="closeMenu()">Get Started</a>
        </div>
      }
    </div>
  </div>
</div>
