<div>
  <div class="scroll-progress-container">
    <div class="scroll-progress-bar" [style.width.%]="scrollProgress()"></div>
  </div>
  <div class="container">
  <nav class="navbar">
    <a class="nav-brand" routerLink="/">Edu<span>Mart</span></a>

    <div class="nav-links">
      <a routerLink="/courses" routerLinkActive="active">Courses</a>
      <a routerLink="/" fragment="categories">Categories</a>
    </div>

    <div class="nav-actions">
      @if (currentUser().token) {
        <a routerLink="/my-courses" routerLinkActive="active">My Courses</a>
        <a routerLink="/cart" routerLinkActive="active">Cart</a>
        <button class="btn-outline" (click)="logout()">Logout</button>
      } @else {
        <a routerLink="/login" routerLinkActive="active">Login</a>
        <a routerLink="/register" class="btn-solid" routerLinkActive="active">Register</a>
      }
    </div>
  </nav>
</div>

</div>
